<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box con Párrafos Alineados</title>
    <style>
        body{
            background-color: antiquewhite;
        }
        .box {
            background-color: azure;
            width: 300px;
            padding: 10px;
            margin: 20px auto;
            border: 2px solid black;
        }
        .left {
            text-align: left;
            border: 2px solid red;
        }
        .center {
            text-align: center;
            border: 2px solid green;
        }
        .right {
            text-align: right;
            border: 2px solid blue;
        }
    </style>
</head>
<body>
    <div class="box left">
        <p>Text</p>
    </div>
    <div class="box center">
        <p>Text</p>
    </div>
    <div class="box right">
        <p>Text</p>
    </div>
</body>
</html>
