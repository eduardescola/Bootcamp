<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box con Bordes Personalizados</title>
    <style>
      .custom-box {
        width: 300px;
        padding: 20px;
        text-align: left;
        border-left: double 6px black;
        border-top: dotted 4px green;
        border-right: dashed 4px blue;
        border-bottom: solid 4px red;
        margin: 50px auto;
      }
      h2 {
            margin: 30px 0;
            text-align: left;
            margin-left: 20px;
      }
      p {
            margin-bottom: 30px;
            margin-left: 20px;
            margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <div class="custom-box">
      <h2>Título en Medio</h2>
      <p>
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Sequi ratione
        fugiat quas temporibus blanditiis nisi sit modi rem voluptatibus! Iste
        animi architecto dolore eum repellendus mollitia quis cum, deleniti
        adipisci!
      </p>
    </div>
  </body>
</html>
