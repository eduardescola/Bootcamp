<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño con Float y Clear</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        .red {
            background-color: red;
            height: 20%;
            width: 100%;
        }

        .blue {
            background-color: blue;
            height: 5%;
            width: 100%;
            clear: both;
        }

        .container {
            height: 70%;
            width: 100%;
        }

        .beige {
            background-color: #f5deb3;
            width: 68%;
            height: 100%;
            float: left;
            margin-right: 4%; 
        }

        .purple {
            background-color: purple;
            width: 25%;
            height: 100%;
            float: right;
        }

        .clearfix {
            clear: both;
        }

        .yellowgreen {
            background-color: yellowgreen;
            height: 25%;
            width: 100%;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="red"></div>
    <div class="blue"></div>
    <div class="container">
        <div class="beige"></div>
        <div class="purple"></div>
    </div>
    <div class="clearfix"></div>
    <div class="yellowgreen"></div>
</body>
</html>
