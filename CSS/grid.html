<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .grid-container {
            display: grid;
            width: 100vw;
            height: 100vh;
        }

        .header { background: navy; grid-area: header; }
        .menu { background: red; grid-area: menu; }
        .hero { background: skyblue; grid-area: hero; }
        .main { background: darkslategray; grid-area: main; }
        .banner { background: gold; grid-area: banner; }
        .extra { background: lightgreen; grid-area: extra; }
        .image { background: lightgray; grid-area: image; }
        .empty { background: white; grid-area: empty; }

        .grid-item {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
        }

        /* Para pantallas pequeñas */
        @media (max-width: 425px) {
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "menu"
                    "hero"
                    "main"
                    "banner"
                    "extra"
                    "image";
            }
        }

        /* Para tabletas (426px a 768px) */
        @media (min-width: 426px) and (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr 2fr 3fr;
                grid-template-rows: 20vh 20vh 20vh 20vh 20vh;
                grid-template-areas:
                    "header header header"
                    "hero hero hero"
                    "menu main main"
                    "menu banner banner"
                    "menu extra image";
            }
        }

        /* Para pantallas grandes */
        @media (min-width: 769px) {
            .grid-container {
                grid-template-columns: 1fr 3fr 1fr 1fr;
                grid-template-areas:
                    "header header menu menu"
                    "hero hero hero hero"
                    "main main empty image"
                    "main main empty extra"
                    "banner banner banner banner";
            }
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item header">HEADER</div>
        <div class="grid-item menu">MENU</div>
        <div class="grid-item hero">HERO</div>
        <div class="grid-item main">MAIN</div>
        <div class="grid-item empty"></div>
        <div class="grid-item image">IMAGE</div>
        <div class="grid-item extra">EXTRA</div>
        <div class="grid-item banner">BANNER</div>
    </div>
</body>
</html>
