<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries Background</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        /* Pantallas grandes */
        body {
            background-color: orange;
        }

        /* Tablets */
        @media (max-width: 1024px) {
            body {
                background-color: green;
            }
        }

        /* Móviles */
        @media (max-width: 600px) {
            body {
                background-color: blue;
            }
        }
    </style>
</head>
<body>
    <p>Redimensiona la pantalla para ver el cambio de color.</p>
</body>
</html>
