<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Roja con Bordes Redondeados en Esquinas</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Caja Roja sin bordes redondeados */
        .box {
            width: 300px;
            height: 300px;
            background-color: red;
            position: relative;
            border: 2px solid black; /* Borde de la caja */
        }

        /* Esquinas redondeadas amarillas */
        .corner {
            width: 30px;
            height: 30px;
            background-color: yellowgreen;
            border: 2px solid black;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50%; /* Hace las esquinas redondas */
        }

        /* Posicionamiento de las esquinas */
        .corner.top-left {
            top: -15px;
            left: -15px;
        }
        .corner.top-right {
            top: -15px;
            right: -15px;
        }
        .corner.bottom-left {
            bottom: -15px;
            left: -15px;
        }
        .corner.bottom-right {
            bottom: -15px;
            right: -15px;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="corner top-left">1</div>
        <div class="corner top-right">2</div>
        <div class="corner bottom-left">3</div>
        <div class="corner bottom-right">4</div>
    </div>

</body>
</html>
