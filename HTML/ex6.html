<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
</head>
<body>
    <h2>Formulario de Contacto</h2>
    <form action="https://formsubmit.co/edduardescola@gmail.com" method="POST">
        <!-- Campo para correo electrónico -->
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required placeholder="Tu correo">
        <br><br>
        
        <!-- Campo para número de teléfono -->
        <!-- <label for="telefono">Número de teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required placeholder="Tu teléfono">
        <br><br> -->
        
        <!-- Campo para mensaje -->
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" required placeholder="Escribe tu mensaje aquí"></textarea>
        <br><br>

        <!-- Campo oculto para evitar el spam -->
        <input type="hidden" name="_next" value="https://formsubmit.co/thanks">
        <input type="hidden" name="_subject" value="Nuevo mensaje desde el formulario">

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
