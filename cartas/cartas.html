<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voltear Carta</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }

    .contenedor-carta {
      position: relative;
      width: 150px;
      height: 200px;
      cursor: pointer;
      /* Definimos la transición para el voltear */
      transition: transform 0.4s;
    }

    /* Imagen de la carta boca abajo */
    .carta-boca-abajo {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
    }

    /* Imagen de la carta frontal (oculta por defecto) */
    .carta-frontal {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      transform: rotateY(180deg); /* Voltear la carta frontal */
    }

    /* Al pasar el cursor sobre el contenedor, mostramos la parte frontal */
    .contenedor-carta:hover .carta-boca-abajo {
      transform: rotateY(180deg);
    }

    .contenedor-carta:hover .carta-frontal {
      transform: rotateY(360deg);
    }
  </style>
</head>
<body>

  <div class="contenedor-carta">
    <!-- Carta Boca Abajo -->
    <img src="./card-back.png" alt="Carta Boca Abajo" class="carta-boca-abajo">
    <!-- Carta Frontal -->
    <img src="./card-front.png" alt="Carta Frontal" class="carta-frontal">
  </div>

</body>
</html>
