<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuck Norris Jokes</title>
    <link href="https://unpkg.com/nes.css/css/nes.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet" />
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            text-align: center;
            background-color: #b5d98a;
            padding: 20px;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-top: 50px;
        }
        .joke-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 500px;
            padding: 20px;
            border: 4px solid black;
        }
        .chuck-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }
        p{
            color: black;
        }
    </style>
</head>
<body>

    <h1 class="nes-text is-primary">Chuck Norris Jokes</h1>
    
    <div class="container">
        <div class="nes-container is-dark with-title joke-box">
            <img src="https://api.chucknorris.io/img/chucknorris_logo_coloured_small@2x.png" class="chuck-img" alt="Chuck Norris">
            <p id="joke" class="nes-balloon from-left">Cargando chiste...</p>
            <button id="nextJoke" class="nes-btn is-error">Next</button>
        </div>
    </div>

    <script>
        async function getJoke() {
            try {
                const response = await fetch('https://api.chucknorris.io/jokes/random');
                const data = await response.json();
                document.getElementById('joke').textContent = data.value;
            } catch (error) {
                document.getElementById('joke').textContent = "Error al obtener el chiste.";
            }
        }

        document.getElementById('nextJoke').addEventListener('click', getJoke);

        // Cargar un chiste al inicio
        getJoke();
    </script>

</body>
</html>
