<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darbuka Sounds</title>
    <style>
        body {
            text-align: center;
            background-image: url('./img/1.webp'); /* Reemplaza con tu imagen de fondo */
            background-size: cover;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #f4c542;
            font-size: 2rem;
            margin-top: 30px;
        }
        .boton {
            display: inline-block;
            margin: 20px;
            padding: 25px;
            font-size: 25px;
            cursor: pointer;
            border: none;
            border-radius: 15px;
            width: 120px;
            height: 120px;
            background-size: cover;
            color: #f4c542;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            transition: transform 0.2s ease;
        }
        .boton:hover {
            transform: scale(1.1);
        }
        .boton[data-sonido="Darbuka_06_76_SP.mp3"] {
            background-image: url('./img/1.webp'); /* Imagen personalizada para el botón W */
        }
        .boton[data-sonido="Darbuka_18_76_SP.mp3"] {
            background-image: url('./img/2.webp'); /* Imagen personalizada para el botón A */
        }
        .boton[data-sonido="Darbuka_42_76_SP.mp3"] {
            background-image: url('./img/3.webp'); /* Imagen personalizada para el botón S */
        }
        .boton[data-sonido="Darbuka_48_76_SP.mp3"] {
            background-image: url('./img/4.webp'); /* Imagen personalizada para el botón D */
        }
        .boton[data-sonido="Darbuka_66_76_SP.mp3"] {
            background-image: url('./img/5.webp'); /* Imagen personalizada para el botón E */
        }
    </style>
</head>
<body>
    <h1>Darbuka Sounds</h1>
    <button class="boton" data-sonido="Darbuka_06_76_SP.mp3">W</button>
    <button class="boton" data-sonido="Darbuka_18_76_SP.mp3">A</button>
    <button class="boton" data-sonido="Darbuka_42_76_SP.mp3">S</button>
    <button class="boton" data-sonido="Darbuka_48_76_SP.mp3">D</button>
    <button class="boton" data-sonido="Darbuka_66_76_SP.mp3">E</button>

    <script>
        function reproducirSonido(sonido) {
            let audio = new Audio('sounds/' + sonido);
            audio.play();
        }
        
        document.querySelectorAll('.boton').forEach(boton => {
            boton.addEventListener('click', () => {
                reproducirSonido(boton.getAttribute('data-sonido'));
            });
        });
        
        document.addEventListener('keydown', (event) => {
            const teclas = {
                'w': 'Darbuka_06_76_SP.mp3',
                'a': 'Darbuka_18_76_SP.mp3',
                's': 'Darbuka_42_76_SP.mp3',
                'd': 'Darbuka_48_76_SP.mp3',
                'e': 'Darbuka_66_76_SP.mp3'
            };
            if (teclas[event.key]) {
                reproducirSonido(teclas[event.key]);
            }
        });
    </script>
</body>
</html>
