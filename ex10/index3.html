<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartado 3 - Diseño con 3 Columnas Invertidas</title>
    <!-- Incluir Bootstrap desde un CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <!-- Fila 1 con 3 columnas, pero invertidas visualmente -->
        <div class="row mb-3 flex-row-reverse">
            <div class="col bg-primary text-white p-3">Columna 1</div>
            <div class="col bg-success text-white p-3">Columna 2</div>
            <div class="col bg-danger text-white p-3">Columna 3</div>
        </div>
    </div>

    <!-- Incluir Bootstrap JS desde un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
