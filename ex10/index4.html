<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartado 4 - Diseño con Orden Responsivo</title>
    <!-- Incluir Bootstrap desde un CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <!-- Fila con 3 columnas y orden responsive -->
        <div class="row mb-3">
            <div class="col bg-primary text-white p-3 order-xl-3 order-lg-2">
                Columna 1
            </div>
            <div class="col bg-success text-white p-3 order-xl-2 order-lg-3">
                Columna 2
            </div>
            <div class="col bg-danger text-white p-3 order-xl-2 order-lg-1">
                Columna 3
            </div>
        </div>
    </div>

    <!-- Incluir Bootstrap JS desde un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
