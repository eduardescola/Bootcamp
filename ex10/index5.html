<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartado 5 - Diseño con Márgenes y Alineación</title>
    <!-- Incluir Bootstrap desde un CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Usamos container-fluid para que ocupe todo el ancho de la pantalla -->
    <div class="container-fluid mt-5">
        
        <!-- Fila 1: 3 columnas -->
        <div class="row mb-3">
            <!-- Columna 1 (col-3) alineada a la izquierda -->
            <div class="col-3 bg-primary text-white p-3">Columna 1</div>

            <!-- Columna 2 (col-3) alineada a la derecha, con espacio entre -->
            <div class="col-3 ms-auto bg-success text-white p-3">Columna 2</div>

            <!-- Columna 3 (col-3) alineada a la derecha, con espacio entre -->
            <div class="col-3 bg-success text-white p-3">Columna 3</div>
        </div>

        <!-- Fila 2: Columnas alineadas debajo -->
        <div class="row mb-3">
            <!-- Columna 4 (col-3) alineada debajo del espacio vacío de la primera fila -->
            <div class="col-3 offset-3 bg-danger text-white p-3">Columna 4</div> 

            <!-- Columna 5 (col-3) alineada a la derecha -->
            <div class="col-3 ms-auto bg-warning text-white p-3">Columna 5</div> 
        </div>
        </div>
    </div>

    <!-- Incluir Bootstrap JS desde un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
