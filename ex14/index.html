<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio de Bootstrap Responsive</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Clase personalizada para crear columnas de 1/5 (20%) */
    .col-md-2-4 {
      flex: 0 0 auto;
      width: 20%;
    }
    /* Color magenta/fucsia que no viene por defecto en Bootstrap */
    .bg-fuchsia {
      background-color: #ff00ff;
    }
  </style>
</head>
<body>
  <div class="container-fluid p-0">
    <!-- Tamaños md, lg y xl -->
    <div class="row g-0 border border-white">
      <!-- Barra verde superior -->
      <div class="col-12 bg-success p-2">
        <h5 class="text-center text-white m-0">Tamaños md, lg y xl:</h5>
      </div>

      <!-- Contenido principal -->
      <div class="col-12">
        <div class="row g-0 border border-white">
          <!-- Columna roja izquierda -->
          <div class="col-md-3 bg-danger" style="min-height: 300px;"></div>

          <!-- Contenido derecho -->
          <div class="col-md-9">
            <!-- Fila magenta -->
            <div class="row g-0 border border-white">
              <div class="col-12 bg-fuchsia" style="height: 50px;"></div>
            </div>

            <!-- Dos bloques naranjas -->
            <div class="row g-0 border border-white">
              <div class="col-md-6 bg-warning border-end border-white" style="height: 100px;"></div>
              <div class="col-md-6 bg-warning" style="height: 100px;"></div>
            </div>

            <!-- Cuadrados azules (2 filas de 5) -->
            <div class="row g-0 border border-white">
              <div class="col-md-2-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-md-2-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-md-2-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-md-2-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-md-2-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-md-2-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-md-2-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-md-2-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-md-2-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-md-2-4 border border-white bg-primary" style="height: 50px;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Barra verde inferior -->
      <div class="col-12 bg-success p-2"></div>
    </div>

    <!-- Tamaño sm -->
    <div class="row g-0 mt-4 border border-white d-none d-sm-flex d-md-none">
      <div class="col-12 bg-success p-2">
        <h5 class="text-center text-white m-0">Tamaño sm:</h5>
      </div>

      <div class="col-12">
        <div class="row g-0 border border-white">
          <!-- Columna roja izquierda -->
          <div class="col-3 bg-danger" style="min-height: 500px;"></div>

          <!-- Contenido derecho -->
          <div class="col-9">
            <!-- Fila magenta -->
            <div class="row g-0 border border-white">
              <div class="col-12 bg-fuchsia" style="height: 50px;"></div>
            </div>

            <!-- Dos bloques naranjas apilados -->
            <div class="row g-0 border border-white">
              <div class="col-12 bg-warning" style="height: 80px;"></div>
            </div>
            <div class="row g-0 border border-white">
              <div class="col-12 bg-warning" style="height: 80px;"></div>
            </div>

            <!-- Cuadrados azules (4 filas de 3) -->
            <div class="row g-0 border border-white">
              <div class="col-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-4 border border-white bg-primary" style="height: 50px;"></div>
              <div class="col-4 border border-white bg-primary" style="height: 50px;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 bg-success p-2"></div>
    </div>

    <!-- Tamaño xs -->
    <div class="row g-0 mt-4 border border-white d-block d-sm-none">
      <div class="col-12 bg-success p-2">
        <h5 class="text-center text-white m-0">Tamaño xs:</h5>
      </div>

      <div class="col-12">
        <div class="row g-0 border border-white">
          <!-- Columna roja superior -->
          <div class="col-12 bg-danger" style="height: 50px;"></div>

          <!-- Fila magenta -->
          <div class="col-12 bg-fuchsia" style="height: 30px;"></div>

          <!-- Dos bloques naranjas apilados -->
          <div class="col-12 bg-warning border-bottom border-white" style="height: 60px;"></div>
          <div class="col-12 bg-warning" style="height: 60px;"></div>

          <!-- Cuadrados azules (5 filas de 2) -->
          <div class="row g-0 border border-white">
            <div class="col-6 border border-white bg-primary" style="height: 40px;"></div>
            <div class="col-6 border border-white bg-primary" style="height: 40px;"></div>
            <div class="col-6 border border-white bg-primary" style="height: 40px;"></div>
            <div class="col-6 border border-white bg-primary" style="height: 40px;"></div>
            <div class="col-6 border border-white bg-primary" style="height: 40px;"></div>
            <div class="col-6 border border-white bg-primary" style="height: 40px;"></div>
            <div class="col-6 border border-white bg-primary" style="height: 40px;"></div>
            <div class="col-6 border border-white bg-primary" style="height: 40px;"></div>
            <div class="col-6 border border-white bg-primary" style="height: 40px;"></div>
            <div class="col-6 border border-white bg-primary" style="height: 40px;"></div>
          </div>
        </div>
      </div>

      <div class="col-12 bg-success p-2"></div>
    </div>
  </div>

  <!-- Bootstrap JS (opcional, solo si necesitas componentes interactivos) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
