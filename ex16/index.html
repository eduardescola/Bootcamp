<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Numbers</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Estilo para cada número */
    .number-box {
      color: white; /* Color de texto blanco */
      text-align: center;
      padding: 20px;
      border-radius: 8px;
      margin: 0;
    }

    /* En pantallas grandes (por encima de 992px) solo se muestra un número */
    @media (min-width: 992px) {
      .number-lg {
        display: block;
        flex: 0 0 100%; /* 1 número por fila en pantallas grandes */
      }

      .number-sm, .number-md {
        display: none; /* Ocultar números en pantallas grandes */
      }
    }

    /* En pantallas medianas (por debajo de 992px) se muestran 3 números por fila */
    @media (max-width: 991px) {
      .number-lg {
        display: none; /* Ocultar número grande */
      }

      .number-md {
        display: block;
        flex: 0 0 33.33%; /* 3 números por fila */
      }

      .number-sm {
        display: none;
      }
    }

    /* En pantallas más pequeñas (por debajo de 576px) se muestran 4 números por fila */
    @media (max-width: 575px) {
      .number-md {
        display: none; /* Ocultar números de tamaño medio */
      }

      .number-sm {
        display: block;
        flex: 0 0 25%; /* 4 números por fila */
      }
    }

    /* Hacer que todos los números se alineen bien en la fila */
    .row {
      display: flex;
      flex-wrap: wrap;
      margin: 0; /* Eliminar márgenes entre columnas */
    }
  </style>
</head>
<body>

<div class="container-fluid mt-5">
  <div class="row">
    <!-- Número visible solo en pantallas grandes -->
    <div class="number-lg col-12 text-center" style="background-color: #ff9800;">
      <div class="number-box">
        <h1>1</h1>
      </div>
    </div>

    <!-- Números visibles en pantallas medianas (por debajo de 992px) -->
    <div class="number-md col-4 text-center" style="background-color: #4caf50;">
      <div class="number-box">
        <h3>2</h3>
      </div>
    </div>
    <div class="number-md col-4 text-center" style="background-color: #2196f3;">
      <div class="number-box">
        <h3>3</h3>
      </div>
    </div>
    <div class="number-md col-4 text-center" style="background-color: #f44336;">
      <div class="number-box">
        <h3>4</h3>
      </div>
    </div>

    <!-- Números visibles en pantallas pequeñas (por debajo de 576px) -->
    <div class="number-sm col-3 text-center" style="background-color: #9c27b0;">
      <div class="number-box">
        <h3>5</h3>
      </div>
    </div>
    <div class="number-sm col-3 text-center" style="background-color: #8bc34a;">
      <div class="number-box">
        <h3>6</h3>
      </div>
    </div>
    <div class="number-sm col-3 text-center" style="background-color: #ffc107;">
      <div class="number-box">
        <h3>7</h3>
      </div>
    </div>
    <div class="number-sm col-3 text-center" style="background-color: #e91e63;">
      <div class="number-box">
        <h3>8</h3>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
