<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid con Bootstrap</title>
    <!-- Incluir Bootstrap desde un CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <!-- Fila 1: Full width -->
        <div class="row mb-3">
            <div class="col-12 bg-primary text-white p-3">
                Full width
            </div>
        </div>

        <!-- Fila 2: Half width, half width -->
        <div class="row mb-3">
            <div class="col-6 bg-success text-white p-3">
                Half width
            </div>
            <div class="col-6 bg-danger text-white p-3">
                Half width
            </div>
        </div>

        <!-- Fila 3: Third, third, third -->
        <div class="row mb-3">
            <div class="col-4 bg-warning text-white p-3">
                Third
            </div>
            <div class="col-4 bg-info text-white p-3">
                Third
            </div>
            <div class="col-4 bg-dark text-white p-3">
                Third
            </div>
        </div>

        <!-- Fila 4: Two third, third -->
        <div class="row mb-3">
            <div class="col-8 bg-secondary text-white p-3">
                Two thirds
            </div>
            <div class="col-4 bg-light text-dark p-3">
                Third
            </div>
        </div>

        <!-- Fila 5: 1/4, 1/4, 1/4, 1/4 -->
        <div class="row mb-3">
            <div class="col-3 bg-primary text-white p-3">
                1/4
            </div>
            <div class="col-3 bg-success text-white p-3">
                1/4
            </div>
            <div class="col-3 bg-danger text-white p-3">
                1/4
            </div>
            <div class="col-3 bg-warning text-white p-3">
                1/4
            </div>
        </div>

        <!-- Fila 6: 3/4, 1/4 -->
        <div class="row mb-3">
            <div class="col-9 bg-info text-white p-3">
                Three fourths
            </div>
            <div class="col-3 bg-dark text-white p-3">
                One fourth
            </div>
        </div>

       <!-- Fila 1: 1 col, 10 col, 1 col -->
       <div class="row mb-3">
        <div class="col-1 bg-primary text-white p-3">
            1
        </div>
        <div class="col-10 bg-success text-white p-3">
            10 Column
        </div>
        <div class="col-1 bg-danger text-white p-3">
            1
        </div>
    </div>
    </div>

    <!-- Incluir Bootstrap JS desde un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
