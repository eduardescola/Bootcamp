<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid con Bootstrap</title>
    <!-- Incluir Bootstrap desde un CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <!-- Fila 1: 13 columnas de tamaño 1 -->
        <div class="row mb-3">
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
            <div class="col-1 bg-info text-white p-3">col 1</div>
        </div>

        <!-- Fila 2: 4 columnas de tamaño 3 -->
        <div class="row mb-3">
            <div class="col-3 bg-success text-white p-3">col 3</div>
            <div class="col-3 bg-success text-white p-3">col 3</div>
            <div class="col-3 bg-success text-white p-3">col 3</div>
            <div class="col-3 bg-success text-white p-3">col 3</div>
        </div>

        <!-- Fila 3: 3 columnas de tamaño 4 -->
        <div class="row mb-3">
            <div class="col-4 bg-primary text-white p-3">col 4</div>
            <div class="col-4 bg-primary text-white p-3">col 4</div>
            <div class="col-4 bg-primary text-white p-3">col 4</div>
        </div>

        <!-- Fila 4: 1 columna de tamaño 8 y 1 columna de tamaño 4 -->
        <div class="row mb-3">
            <div class="col-8 bg-secondary text-white p-3">col 8</div>
            <div class="col-4 bg-light text-dark p-3">col 4</div>
        </div>

        <!-- Fila 5: 2 columnas de tamaño 2, 1 columna de tamaño 4, 2 columnas de tamaño 2 -->
        <div class="row mb-3">
            <div class="col-2 bg-primary text-white p-3">col 2</div>
            <div class="col-2 bg-success text-white p-3">col 2</div>
            <div class="col-4 bg-danger text-white p-3">col 4</div>
            <div class="col-2 bg-warning text-white p-3">col 2</div>
            <div class="col-2 bg-info text-white p-3">col 2</div>
        </div>

        <!-- Fila 6: 2 columnas de tamaño 6 -->
        <div class="row mb-3">
            <div class="col-6 bg-dark text-white p-3">col 6</div>
            <div class="col-6 bg-secondary text-white p-3">col 6</div>
        </div>

        <!-- Fila 7: 1 columna de tamaño 12 -->
        <div class="row mb-3">
            <div class="col-12 bg-info text-white p-3">col 12</div>
        </div>
    </div>

    <!-- Incluir Bootstrap JS desde un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
