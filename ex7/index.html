<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Responsivo con Bootstrap</title>
    <!-- Incluir Bootstrap desde un CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <!-- Fila 1: 5 columnas con col-sm (para pantallas pequeñas) -->
        <div class="row mb-3">
            <div class="col-sm bg-primary text-white p-3">col-sm</div>
            <div class="col-sm bg-success text-white p-3">col-sm</div>
            <div class="col-sm bg-danger text-white p-3">col-sm</div>
            <div class="col-sm bg-warning text-white p-3">col-sm</div>
            <div class="col-sm bg-info text-white p-3">col-sm</div>
        </div>

        <!-- Fila 2: 3 columnas con col-lg (para pantallas grandes) -->
        <div class="row mb-3">
            <div class="col-lg bg-primary text-white p-3">col-lg</div>
            <div class="col-lg bg-success text-white p-3">col-lg</div>
            <div class="col-lg bg-danger text-white p-3">col-lg</div>
        </div>

        <!-- Fila 3: 2 columnas con col-xl (para pantallas extra grandes) -->
        <div class="row mb-3">
            <div class="col-xl bg-warning text-white p-3">col-xl</div>
            <div class="col-xl bg-info text-white p-3">col-xl</div>
        </div>
    </div>

    <!-- Incluir Bootstrap JS desde un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
