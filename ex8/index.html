<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Responsivo</title>
    <!-- Incluir Bootstrap desde un CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <!-- Fila con 3 rectángulos -->
        <div class="row mb-3">
            <!-- Primer rectángulo: En xs ocupa todo el ancho (12), en sm, md y lg ocupa 12 (ancho completo) -->
            <div class="col-12 col-sm-12 col-md-12 col-lg-12 bg-primary text-white p-3">Rectángulo 1</div>
            
            <!-- Segundo rectángulo: En xs ocupa todo el ancho (12), en sm ocupa 4 (1/3), en lg ocupa 4 -->
            <div class="col-12 col-sm-4 col-md-4 col-lg-4 bg-success text-white p-3">Rectángulo 2</div>
            
            <!-- Tercer rectángulo: En xs ocupa todo el ancho (12), en sm ocupa 8 (2/3), en lg ocupa 8 -->
            <div class="col-12 col-sm-8 col-md-8 col-lg-8 bg-danger text-white p-3">Rectángulo 3</div>
        </div>
    </div>

    <!-- Incluir Bootstrap JS desde un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
