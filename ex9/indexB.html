<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartado B - Grid Responsivo</title>
    <!-- Incluir Bootstrap desde un CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <!-- Fila con 3 columnas -->
        <div class="row mb-3">
            <!-- Columna con ancho variable en lg -->
            <div class="col-lg-auto bg-primary text-white p-3">Columna de ancho variable 1</div>
            
            <!-- Columna con tamaño fijo en lg -->
            <div class="col-lg-auto bg-success text-white p-3">Columna de ancho variable 2</div>
            
            <!-- Columna con tamaño fijo en lg -->
            <div class="col-lg-auto bg-danger text-white p-3">Columna de ancho variable 3</div>
        </div>
    </div>

    <!-- Incluir Bootstrap JS desde un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
