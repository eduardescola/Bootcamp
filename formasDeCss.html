<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas de aplicar CSS</title>
    
    <!-- 1. CSS Externo -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- 2. CSS Interno -->
    <style>
        @import url('styles-import.css');
        
        .interno {
            color: blue;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <!-- 3. CSS en línea -->
    <p style="color: red; font-weight: bold;">Este es un ejemplo de CSS en línea</p>
    
    <p class="interno">Este es un ejemplo de CSS interno</p>
    
    <p class="externo">Este es un ejemplo de CSS externo</p>
    
    <!-- 4. CSS en un atributo style dentro de una etiqueta <style> en el head -->
    <p id="especifico">Este es un ejemplo de CSS por ID</p>
</body>
</html>
