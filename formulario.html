<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <!-- Incluir Bootstrap CSS desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f9;
            padding: 50px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Formulario de Registro</h2>
        <form id="registrationForm">
            <!-- Nombre -->
            <div class="mb-3">
                <label for="firstName" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="firstName" name="firstName" required>
                <div class="invalid-feedback">Por favor ingresa tu nombre.</div>
            </div>

            <!-- Apellido -->
            <div class="mb-3">
                <label for="lastName" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="lastName" name="lastName" required>
                <div class="invalid-feedback">Por favor ingresa tu apellido.</div>
            </div>

            <!-- Usuario -->
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required>
                <div class="invalid-feedback">Por favor ingresa un nombre de usuario.</div>
            </div>

            <!-- Ciudad -->
            <div class="mb-3">
                <label for="city" class="form-label">Ciudad</label>
                <input type="text" class="form-control" id="city" name="city" required>
                <div class="invalid-feedback">Por favor ingresa tu ciudad.</div>
            </div>

            <!-- Estado (Desplegable) -->
            <div class="mb-3">
                <label for="state" class="form-label">Estado</label>
                <select class="form-select" id="state" name="state" required>
                    <option value="">Selecciona un estado</option>
                    <option value="1">Estado 1</option>
                    <option value="2">Estado 2</option>
                    <option value="3">Estado 3</option>
                </select>
                <div class="invalid-feedback">Por favor selecciona un estado.</div>
            </div>

            <!-- Términos y Condiciones -->
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                <label class="form-check-label" for="terms">Estoy de acuerdo con los términos y condiciones</label>
                <div class="invalid-feedback">Debes aceptar los términos y condiciones.</div>
            </div>

            <!-- Botón de Enviar -->
            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
        </form>
    </div>

    <!-- Incluir Bootstrap JS y Popper.js desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <script>
        // Validación del formulario usando JavaScript
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')

            // Establecer validez del formulario cuando se envíe
            Array.from(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()

        // Inicializar la validación en el formulario
        const form = document.getElementById('registrationForm');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Evitar que el formulario se envíe
            if (form.checkValidity()) {
                alert('Formulario enviado correctamente');
            } else {
                form.classList.add('was-validated');
            }
        });
    </script>

</body>
</html>
