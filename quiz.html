<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Programación Básica</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .question {
            margin: 20px 0;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .options li {
            margin: 10px 0;
        }
        .options input {
            margin-right: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled {
            background-color: #ddd;
            cursor: not-allowed;
        }
        .result {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Quiz de Programación Básica</h1>
        
        <div id="quiz">
            <!-- Las preguntas y respuestas se inyectarán aquí con JavaScript -->
        </div>

        <button id="submitBtn" onclick="submitQuiz()">Enviar respuestas</button>

        <div id="result" class="result">
            <h2>Resultado:</h2>
            <p id="score"></p>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "¿Qué es HTML?",
                options: ["Un lenguaje de programación", "Un lenguaje de marcado", "Un sistema operativo", "Un navegador web"],
                correct: 1
            },
            {
                question: "¿Cómo se llama el lenguaje de programación que se usa para hacer páginas web dinámicas?",
                options: ["Java", "C#", "JavaScript", "PHP"],
                correct: 2
            },
            {
                question: "¿Cuál es el operador para asignar un valor a una variable en JavaScript?",
                options: ["=", "==", "===" , "=>"],
                correct: 0
            },
            {
                question: "¿Cuál es el resultado de 10 + '10' en JavaScript?",
                options: ["20", "1010", "NaN", "Error"],
                correct: 1
            },
            {
                question: "¿Qué es CSS?",
                options: ["Lenguaje de programación", "Lenguaje de diseño de páginas web", "Base de datos", "Servidor web"],
                correct: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        function displayQuestion() {
            const question = questions[currentQuestionIndex];
            const quizContainer = document.getElementById('quiz');
            quizContainer.innerHTML = `
                <div class="question">
                    <p><strong>${question.question}</strong></p>
                    <ul class="options">
                        ${question.options.map((option, index) => `
                            <li>
                                <input type="radio" name="option" value="${index}" id="option${index}">
                                <label for="option${index}">${option}</label>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `;
        }

        function submitQuiz() {
            const selectedOption = document.querySelector('input[name="option"]:checked');
            if (selectedOption) {
                const answer = parseInt(selectedOption.value);
                if (answer === questions[currentQuestionIndex].correct) {
                    score++;
                }
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                displayQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const resultContainer = document.getElementById('result');
            const scoreElement = document.getElementById('score');
            resultContainer.style.display = 'block';
            scoreElement.textContent = `Has obtenido ${score} de ${questions.length} puntos.`;
            document.getElementById('submitBtn').disabled = true;
        }

        // Mostrar la primera pregunta
        displayQuestion();
    </script>

</body>
</html>
