<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario con Validación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="./javascript/validacion.js" defer></script> <!-- El archivo JavaScript generado por TypeScript -->
</head>
<body>

  <div class="container my-5">
    <h2 class="text-center">Formulario de Registro</h2>
    <form id="registrationForm">
      <div class="mb-3">
        <label for="firstName" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="firstName" placeholder="Introduce tu nombre">
        <div class="invalid-feedback" id="firstNameError">El nombre es obligatorio.</div>
      </div>
      
      <div class="mb-3">
        <label for="lastName" class="form-label">Apellido</label>
        <input type="text" class="form-control" id="lastName" placeholder="Introduce tu apellido">
        <div class="invalid-feedback" id="lastNameError">El apellido es obligatorio.</div>
      </div>
      
      <div class="mb-3">
        <label for="username" class="form-label">Nombre de usuario</label>
        <input type="text" class="form-control" id="username" placeholder="Introduce tu nombre de usuario">
        <div class="invalid-feedback" id="usernameError">El nombre de usuario debe tener al menos 5 caracteres.</div>
      </div>

      <div class="mb-3">
        <label for="city" class="form-label">Ciudad</label>
        <input type="text" class="form-control" id="city" placeholder="Introduce tu ciudad">
        <div class="invalid-feedback" id="cityError">La ciudad es obligatoria.</div>
      </div>

      <div class="mb-3">
        <label for="state" class="form-label">Estado</label>
        <select class="form-select" id="state">
          <option value="">Selecciona un estado</option>
          <option value="estado1">Estado 1</option>
          <option value="estado2">Estado 2</option>
          <option value="estado3">Estado 3</option>
        </select>
        <div class="invalid-feedback" id="stateError">Debes seleccionar un estado.</div>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="termsCheck">
        <label class="form-check-label" for="termsCheck">Aceptar términos y condiciones</label>
        <div class="invalid-feedback" id="termsError">Debes aceptar los términos y condiciones.</div>
      </div>

      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
